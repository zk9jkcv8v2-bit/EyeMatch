<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07070a" />
  <title>EyeMatch — Your eyes, set in stone</title>
  <link rel="icon" href="/brand/EM_ICON_BEIGE.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="webgl"></div>

  <video id="heroVideo" class="hero-video" autoplay muted loop playsinline hidden></video>

  <div class="ambient"></div>
  <div class="vignette"></div>
  <div id="grain"></div>

  <header class="chrome">
    <a class="wordmark" href="#" id="wordmark" aria-label="EyeMatch">
      <img src="/brand/EM_LOGO_BEIGE.svg" alt="EyeMatch" />
    </a>
  </header>

  <!-- ============ ACT I : DORMANT STONE ============ -->
  <section class="act" id="act-landing">
    <div class="copy">
      <p class="tagline">Every eye holds a <em>color</em>.</p>
      <div class="actions">
        <button class="cta" id="beginBtn">FIND YOUR COLOR</button>
      </div>
    </div>
  </section>

  <!-- ============ ACT II : THE READING ============ -->
  <section class="act" id="act-scan">
    <div class="cam-backdrop"></div>
    <video id="camVideo" class="cam-feed" autoplay playsinline muted></video>
    <div class="cam-vignette"></div>

    <div class="focus" id="focus">
      <svg class="focus-petal" id="focusPetalBg" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
      <svg class="focus-petal draw" id="focusPetalDraw" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
    </div>

    <!-- Front door: a clear choice, no surprise permission prompt -->
    <div class="scan-intro" id="scanIntro">
      <svg class="scan-intro-petal" viewBox="-110 -110 220 220" aria-hidden="true" id="introPetal"></svg>
      <div class="scan-intro-body">
        <p class="eyebrow">STEP 2 OF 2</p>
        <p class="tagline">Let's find your <em>color</em>.</p>
        <p class="scan-sub" id="scanIntroSub">Take a quick photo of your eye — or upload one you already have.</p>
        <div class="actions">
          <button class="cta big" id="useCameraBtn">USE MY CAMERA</button>
          <button class="cta ghost" id="useUploadBtn">UPLOAD A PHOTO</button>
        </div>
      </div>
    </div>

    <!-- Live capture controls -->
    <div class="cam-copy" id="camControls" hidden>
      <p class="tagline status" id="scanStatus">Center your eye, then capture.</p>
      <div class="actions">
        <button class="cta big" id="captureBtn">CAPTURE</button>
      </div>
      <button class="text-link" id="switchUploadBtn">or upload a photo instead</button>
    </div>

    <input type="file" id="uploadInput" accept="image/*" hidden />
    <canvas id="captureCanvas" width="480" height="480" hidden></canvas>
  </section>

  <!-- ============ ACT III : REVEAL ============ -->
  <section class="act" id="act-reveal">
    <div class="copy">
      <p class="eyebrow" id="revealEyebrow">YOUR STONE</p>
      <p class="tagline big" id="stoneName"><em>&nbsp;</em></p>
      <p class="sub" id="revealSub">No two irises are alike. Neither is this.</p>
      <div class="actions">
        <button class="cta" id="reserveBtn">RESERVE YOURS</button>
        <button class="cta ghost" id="againBtn">SCAN AGAIN</button>
      </div>
    </div>
  </section>

  <div class="flash" id="flash"></div>
  <div class="wipe" id="wipe"></div>
  <div class="cursor" id="cursor"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
