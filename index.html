<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07070a" />
  <title>EyeMatch — Every eye holds a color</title>
  <meta name="description" content="EyeMatch transforms the unique colors of your iris into a handcrafted bracelet. No two eyes are alike — neither is your stone." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="EyeMatch — Every eye holds a color" />
  <meta property="og:description" content="The unique colors of your iris, transformed into a handcrafted bracelet." />
  <meta property="og:image" content="/brand/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="/brand/EM_ICON_BEIGE.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Fixed cinematic 3D stage behind everything -->
  <div id="webgl"></div>
  <div class="vignette"></div>
  <div id="grain"></div>

  <header class="chrome">
    <a class="wordmark" href="/" aria-label="EyeMatch">
      <img src="/brand/EM_LOGO_BEIGE.svg" alt="EyeMatch" />
    </a>
  </header>

  <main id="scroll">

    <!-- ============ HERO ============ -->
    <section class="panel" id="hero">
      <div class="sticky center">
        <h1 class="display">Every eye holds a <em>color</em>.</h1>
        <p class="sub">Discover yours.</p>
        <button class="cta" id="beginBtn">BEGIN</button>
      </div>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </section>

    <!-- ============ DISCOVERY ============ -->
    <section class="panel tall" id="discovery">
      <div class="sticky align-right">
        <p class="eyebrow">DISCOVERY</p>
        <h2 class="display sm">Your eye already<br />contains the design.</h2>
        <div class="swatches" id="discSwatches" aria-hidden="true"></div>
      </div>
    </section>

    <!-- ============ TRANSFORMATION ============ -->
    <section class="panel tall" id="transformation">
      <div class="sticky align-right">
        <p class="eyebrow">TRANSFORMATION</p>
        <h2 class="display sm">From biology<br />to craftsmanship.</h2>
        <ol class="steps" id="transformSteps">
          <li>Eye</li>
          <li>Palette</li>
          <li>Bracelet</li>
        </ol>
      </div>
    </section>

    <!-- ============ HANDOFF (end of the slice) ============ -->
    <section class="panel" id="handoff">
      <div class="sticky center">
        <h2 class="display sm">Find your <em>color</em>.</h2>
        <button class="cta" id="beginBtn2">BEGIN YOUR EYEMATCH</button>
      </div>
    </section>

  </main>

  <div class="cursor" id="cursor"></div>

  <script type="module" src="/src/home.js"></script>
</body>
</html>
